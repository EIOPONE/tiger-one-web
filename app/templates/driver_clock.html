<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock in — Tiger One</title>
  <style>
    :root { --orange:#E3783E; --orange-dark:#B65321; --ink:#17191C; --line:#DFE2E4; --muted:#70757C; --surface:#F4F5F5; --green:#247A52; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--surface); color: var(--ink); }
    header { background: var(--ink); color: #fff; padding: 18px 20px; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; color: #cfd2d5; font-size: 14px; }
    .tabbar { position: sticky; top: 0; z-index: 20; display: flex; background: #fff; border-bottom: 1px solid var(--line); }
    .tabbar a, .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 700; background: none; border: 0; margin: 0; }
    .tabbar .icon { font-size: 19px; }
    main { max-width: 440px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 16px; text-align: center; }
    .status { display: flex; align-items: center; gap: 10px; background: #E7F3ED; border: 1px solid #BEE3CE; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; color: var(--green); font-weight: 700; font-size: 14px; }
    .big-btn { width: 100%; padding: 24px; border: 0; border-radius: 16px; font-size: 19px; font-weight: 800; }
    .start-btn { background: var(--green); color: #fff; }
    .finish-btn { background: var(--orange); color: #fff; margin-top: 4px; }
    .big-btn .emoji { display: block; font-size: 32px; margin-bottom: 8px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 4px 0 8px; font-weight: 600; text-align: left; }
    input[type=number] { width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 10px; font-size: 20px; text-align: center; margin-bottom: 16px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: -10px; margin-bottom: 16px; text-align: left; }
  </style>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#17191C">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiger One">
  <script src="/static/register-sw.js" defer></script>
</head>
<body>
  <header>
    <h1>📍 {{ clock_point.name }}</h1>
    <p>{{ user.full_name }}</p>
  </header>
  <nav class="tabbar">
    <a href="/driver"><span class="icon">🏠</span>Home</a>
    <a href="/driver/vehicle-check"><span class="icon">📋</span>Vehicle Check</a>
    <form method="post" action="/web-logout"><button type="submit"><span class="icon">🔒</span>Log out</button></form>
  </nav>
  <main>
    {% if not active_entry %}
    <div class="card">
      <form method="post" action="/driver/clock/{{ clock_point.token }}/start">
        <button class="big-btn start-btn" type="submit"><span class="emoji">▶️</span>Start Work</button>
      </form>
    </div>
    {% else %}
    <div class="status">🕐 Clocked in since {{ active_entry.started_at.strftime('%H:%M') }}</div>
    <div class="card">
      <form method="post" action="/driver/clock/{{ clock_point.token }}/finish">
        <label for="driving_hours">Your driving hours today (from the tacho)</label>
        <input type="number" step="0.25" min="0" id="driving_hours" name="driving_hours" required placeholder="e.g. 4">
        <div class="hint">Enter this after your last drop-off of the day — you can't finish work without it.</div>
        <button class="big-btn finish-btn" type="submit"><span class="emoji">⏹</span>Finish Work</button>
      </form>
    </div>
    {% endif %}
  </main>
</body>
</html>
