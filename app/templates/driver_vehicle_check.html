<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle check — Tiger One</title>
  <style>
    :root { --orange:#E3783E; --orange-dark:#B65321; --ink:#17191C; --line:#DFE2E4; --muted:#70757C; --surface:#F4F5F5; --red:#B42318; --green:#247A52; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--surface); color: var(--ink); }
    header { background: var(--ink); color: #fff; padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 18px; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: 100px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    label.field-label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
    select, textarea { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; font-family: inherit; }
    .group-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 700; margin: 20px 4px 8px; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: none; }
    .item .label { font-size: 14px; flex: 1; }
    .toggle { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
    .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .toggle label { padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); background: #fff; }
    .toggle input:checked + label.pass-label { background: var(--green); color: #fff; }
    .toggle input:checked + label.defect-label { background: var(--red); color: #fff; }
    canvas { width: 100%; height: 200px; border: 1px dashed var(--line); border-radius: 10px; touch-action: none; background: #fff; }
    button.submit-btn { position: fixed; bottom: 0; left: 0; right: 0; padding: 18px; border: 0; background: var(--orange); color: #fff; font-size: 16px; font-weight: 700; }
    button.secondary { width: 100%; padding: 12px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 14px; margin-top: 8px; }
    .tabbar { position: sticky; top: 0; z-index: 20; display: flex; background: #fff; border-bottom: 1px solid var(--line); }
    .tabbar a, .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 700; background: none; border: 0; margin: 0; }
    .tabbar .icon { font-size: 19px; }
    .tabbar a.active { color: var(--orange-dark); }
  </style>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#17191C">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiger One">
  <script src="/static/register-sw.js" defer></script>
</head>
<body>
  <header>
    <h1>Daily vehicle check</h1>
  </header>
  <nav class="tabbar">
    <a href="/driver"><span class="icon">🏠</span>Home</a>
    <a href="/driver/vehicle-check" class="active"><span class="icon">📋</span>Vehicle Check</a>
    <form method="post" action="/web-logout"><button type="submit"><span class="icon">🔒</span>Log out</button></form>
  </nav>
  <main>
    <form method="post" action="/driver/vehicle-check/submit" id="check-form">
      <div class="card">
        <label class="field-label" for="vehicle_id">Which vehicle?</label>
        <select id="vehicle_id" name="vehicle_id" required>
          <option value="" disabled selected>Choose a vehicle</option>
          {% for v in vehicles %}<option value="{{ v.vehicle_id }}">{{ v.registration }}{% if v.description %} — {{ v.description }}{% endif %}</option>{% endfor %}
        </select>
      </div>

      {% for group in checklist %}
      <div class="card">
        <div class="group-title" style="margin-top:0;">{{ group.group }}</div>
        {% for key, text in group.checks %}
        <div class="item">
          <span class="label">{{ text }}</span>
          <div class="toggle">
            <input type="radio" name="{{ key }}" id="{{ key }}_pass" value="pass" checked>
            <label class="pass-label" for="{{ key }}_pass">✓ Pass</label>
            <input type="radio" name="{{ key }}" id="{{ key }}_defect" value="defect">
            <label class="defect-label" for="{{ key }}_defect">⚠ Defect</label>
          </div>
        </div>
        {% endfor %}
      </div>
      {% endfor %}

      <div class="card">
        <label class="field-label" for="defect_notes">Defect notes (if any defects marked above)</label>
        <textarea id="defect_notes" name="defect_notes" rows="3" placeholder="Describe what's wrong and where"></textarea>
      </div>

      <div class="card">
        <label class="field-label">Signature</label>
        <canvas id="pad" width="600" height="240"></canvas>
        <button type="button" class="secondary" id="clear-pad">Clear signature</button>
      </div>

      <button class="submit-btn" type="submit">Submit check</button>
    </form>
  </main>

  <script>
    const canvas = document.getElementById('pad');
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#17191C';
    let drawing = false;
    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - rect.left) * (canvas.width / rect.width),
               y: (t.clientY - rect.top) * (canvas.height / rect.height) };
    }
    function start(e) { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
    function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
    function end() { drawing = false; }
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
    document.getElementById('clear-pad').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

    document.getElementById('check-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
      const fd = new FormData(form);
      fd.append('signature', blob, 'signature.png');
      const res = await fetch(form.action, { method: 'POST', body: fd });
      if (res.redirected) { window.location.href = res.url; }
      else if (res.ok) { window.location.href = '/driver'; }
      else { alert('Something went wrong submitting the check — please try again.'); }
    });
  </script>
</body>
</html>
